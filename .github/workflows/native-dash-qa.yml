name: Native Dash browser verification
on:
  push:
    branches: [codex/native-dash-20260908]
    paths: ['native/**', '.github/workflows/native-dash-qa.yml']
permissions:
  contents: write
concurrency:
  group: native-dash-demo
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run deterministic engine tests
        run: |
          mkdir -p evidence
          node --test native/tests/engine.test.mjs | tee evidence/engine-tests.txt
          node native/tools/build.mjs
          node --check native/dist/game.js
      - name: Install browser verification tools
        run: |
          pip install playwright==1.52.0 pillow requests
          python -m playwright install --with-deps chromium
      - name: Capture official reference and existing site
        run: |
          mkdir -p evidence/reference
          python - <<'PY'
          import json,pathlib,requests
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('evidence/reference')
          try:
              r=requests.get('https://itunes.apple.com/lookup?id=625334537&country=us',timeout=45);r.raise_for_status();app=r.json()['results'][0]
              urls=app.get('screenshotUrls',[]) or app.get('ipadScreenshotUrls',[])
              (out/'source.json').write_text(json.dumps({'source':'https://apps.apple.com/us/app/geometry-dash/id625334537','version':app.get('version'),'screenshots':urls},indent=2))
              for i,url in enumerate(urls[:4]):
                  url=url.replace('406x228bb.jpg','1280x720bb.jpg');image=requests.get(url,timeout=45);image.raise_for_status();(out/f'apple-{i+1}.jpg').write_bytes(image.content)
          except Exception as exc:(out/'reference-error.txt').write_text(str(exc))
          with sync_playwright() as p:
              browser=p.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1000})
              try:
                  page.goto('https://geometrylite.net',wait_until='domcontentloaded',timeout=60000);page.wait_for_timeout(2000);page.screenshot(path=str(out/'geometrylite-before.png'))
              except Exception as exc:(out/'website-error.txt').write_text(str(exc))
              browser.close()
          PY
      - name: Publish only the original native game to isolated branch
        id: publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/native-publish"
          mkdir -p "$DEST/source"
          cp native/dist/index.html native/dist/game.js "$DEST/"
          cp -R native/src native/tools native/tests "$DEST/source/"
          cp native/index.html native/package.json native/README.md "$DEST/source/"
          printf 'Source commit: %s\n' "$GITHUB_SHA" > "$DEST/BUILD.txt"
          git fetch origin refs/heads/native-dash-demo-20260908:refs/remotes/origin/native-dash-demo-20260908 2>/dev/null || true
          parent=$(git rev-parse --verify refs/remotes/origin/native-dash-demo-20260908 2>/dev/null || true)
          export GIT_INDEX_FILE="$RUNNER_TEMP/native-publish-index"
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          export GIT_WORK_TREE="$DEST"
          git read-tree --empty
          cd "$DEST"
          git add --all .
          tree=$(git write-tree)
          if [ -n "$parent" ]; then
            commit=$(printf 'build: native demo from %s\n' "$GITHUB_SHA" | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'build: isolated native demo from %s\n' "$GITHUB_SHA" | git commit-tree "$tree")
          fi
          git push origin "$commit:refs/heads/native-dash-demo-20260908"
          echo "DEMO_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "DEMO_URL=https://raw.githack.com/AndrewC776/Geometrylite/$commit/index.html" >> "$GITHUB_ENV"
          echo "url=https://raw.githack.com/AndrewC776/Geometrylite/$commit/index.html" >> "$GITHUB_OUTPUT"
      - name: Verify the actual public HTTPS demo
        env:
          RUN_REMOTE: '1'
          EVIDENCE_DIR: evidence/browser
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import os,json,pathlib,hashlib
          pathlib.Path('evidence/deployment.json').write_text(json.dumps({'url':os.environ['DEMO_URL'],'source_commit':os.environ['GITHUB_SHA'],'demo_commit':os.environ['DEMO_COMMIT'],'html_sha256':hashlib.sha256(pathlib.Path('native/dist/index.html').read_bytes()).hexdigest()},indent=2))
          PY
          python native/tests/browser_smoke.py
      - name: Package complete original source and standalone game
        if: always()
        run: |
          mkdir -p evidence/package
          cp native/dist/index.html native/dist/game.js evidence/package/
          tar -czf evidence/package/geometrylite-native-source.tar.gz -C native src tools tests index.html package.json README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dash-evidence
          path: evidence/
          retention-days: 30
      - name: Record demo URL
        if: always()
        run: |
          echo '## GeometryLite native demo' >> "$GITHUB_STEP_SUMMARY"
          echo "$DEMO_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'See the evidence artifact for actual screenshot and audio verification; no 90% equivalence certification is claimed.' >> "$GITHUB_STEP_SUMMARY"
