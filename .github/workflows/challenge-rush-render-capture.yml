name: Challenge Rush actual gameplay capture
on:
  push:
    branches: [codex/native-dash-20260908]
    paths: ['.github/workflows/challenge-rush-render-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.52.0 pillow
      - name: Capture public game after Unity startup
        run: |
          mkdir -p capture
          cat > /tmp/capture.py <<'PY'
          import json,pathlib,time,re
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('capture');report={'source':'https://1games.io/challenge-rush','actual_frame_source':'https://challengerush.com/','viewport':{'width':960,'height':540},'console':[],'requests':[],'failed':[],'states':[]}
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',headless=True,args=['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage'])
              ctx=b.new_context(viewport={'width':960,'height':540},device_scale_factor=1)
              page=ctx.new_page();page.set_default_timeout(20000)
              page.on('console',lambda e:report['console'].append({'type':e.type,'text':e.text[:1800]}) if len(report['console'])<100 else None)
              page.on('requestfailed',lambda r:report['failed'].append({'url':r.url.split('?')[0],'failure':r.failure}))
              def resp(r):
                  try:
                      if 'play.challengerush' in r.url or any(x in r.url for x in ['.mp3','.ogg','.m4a','/api/']):report['requests'].append({'url':r.url.split('?')[0],'status':r.status,'type':r.headers.get('content-type'),'bytes':r.headers.get('content-length')})
                  except Exception:pass
              page.on('response',resp)
              def snap(label):
                  state={'label':label,'url':page.url}
                  try:
                      page.screenshot(path=str(out/(label+'.png')),timeout=60000)
                      c=page.locator('#unity-canvas');rect=c.bounding_box(timeout=10000) if c.count() else None;state['canvas']=rect
                      if rect and rect['width']>0:c.screenshot(path=str(out/(label+'-canvas.png')),timeout=25000)
                  except Exception as e:state['capture_error']=str(e)
                  report['states'].append(state);(out/'report.json').write_text(json.dumps(report,indent=2));print(state,flush=True)
              try:
                  page.goto('https://challengerush.com/',wait_until='domcontentloaded',timeout=45000)
                  page.locator('#playBtn').click();page.wait_for_timeout(65000);snap('01-menu')
                  for i,(rx,ry) in enumerate([(0.5,.53),(.5,.60),(.5,.5)]):
                      c=page.locator('#unity-canvas');r=c.bounding_box()
                      if not r:break
                      page.mouse.click(r['x']+r['width']*rx,r['y']+r['height']*ry)
                      page.wait_for_timeout(2500);snap(f'02-click-{i}')
                  for i in range(4):page.keyboard.press('Space');page.wait_for_timeout(550);snap(f'03-input-{i}')
              except Exception as e:report['exception']=str(e)
              finally:b.close()
          (out/'report.json').write_text(json.dumps(report,indent=2))
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-rush-render-capture
          path: capture/
          retention-days: 14
